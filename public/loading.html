        /* صفحه‌ی بارگذاری اولیه‌ی PWA — کاملاً خودکفا (بدون دارایی بیرونی) تا
           حتی در اولین اجرا و حالت آفلاین هم فوری و کامل رندر شود. */
        :root {
            --indigo: #5964AE;
            --indigo-deep: #4d56a3;
            --blue: #1572A1;
            --rose: #D4205F;
            --cyan: #36A9DF;
            --bg: #f8fbff;
            --ink: #1e293b;
            --muted: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'iransans', 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* هاله‌های نوری پس‌زمینه — هم‌خانواده با صفحه‌ی ورود */
        .glow { position: fixed; border-radius: 50%; filter: blur(64px); pointer-events: none; z-index: 0; }
        .glow-a { top: -8rem; right: -6rem; width: 22rem; height: 22rem; background: rgba(54, 169, 223, 0.22); }
        .glow-b { top: 30%; left: -7rem; width: 20rem; height: 20rem; background: rgba(212, 32, 95, 0.14); }
        .glow-c { inset-inline: 0; bottom: -10rem; height: 26rem; width: 40rem; margin-inline: auto; border-radius: 50%; background: radial-gradient(circle at 50% 100%, rgba(89, 100, 174, 0.20), transparent 60%); filter: blur(30px); }

        .stage {
            position: relative;
            z-index: 2;
            width: min(90vw, 22rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* کارت لوگو */
        .logo-card {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            border-radius: 1.75rem;
            background: #fff;
            box-shadow: 0 22px 60px rgba(89, 100, 174, 0.20);
            border: 1px solid rgba(226, 232, 240, 0.9);
            animation: float 3.4s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .logo-card img { width: 5.5rem; height: auto; display: block; }

        /* حلقه‌ی چرخان برند دور لوگو */
        .ring {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--indigo), var(--blue), var(--rose), var(--cyan), var(--indigo));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            animation: spin 2.6s linear infinite;
            opacity: 0.9;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .brand { margin-top: 1.6rem; }
        .brand h1 { font-size: 1.5rem; font-weight: 700; color: var(--indigo-deep); letter-spacing: -0.01em; }
        .brand p { margin-top: 0.4rem; font-size: 0.85rem; font-weight: 400; color: var(--muted); }

        /* نوار پیشرفت درخشان */
        .progress {
            margin-top: 2rem;
            width: 12rem;
            height: 5px;
            border-radius: 999px;
            background: #e6ebf7;
            overflow: hidden;
            position: relative;
        }
        .progress::after {
            content: "";
            position: absolute;
            inset-block: 0;
            width: 45%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--indigo), var(--blue), var(--rose));
            animation: slide 1.25s ease-in-out infinite;
        }
        @keyframes slide { 0% { inset-inline-start: -45%; } 100% { inset-inline-start: 100%; } }

        /* متن بارگذاری با سه نقطه‌ی متحرک */
        .loading-text {
            margin-top: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--indigo);
        }
        .dots { display: inline-flex; gap: 0.28rem; }
        .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--indigo); display: block; animation: blink 1.2s infinite ease-in-out; }
        .dots i:nth-child(2) { animation-delay: 0.2s; background: var(--blue); }
        .dots i:nth-child(3) { animation-delay: 0.4s; background: var(--rose); }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

        .foot {
            position: absolute;
            bottom: max(1.25rem, env(safe-area-inset-bottom));
            inset-inline: 0;
            text-align: center;
            font-size: 0.72rem;
            color: #94a3b8;
            z-index: 2;
        }

        @media (prefers-reduced-motion: reduce) {
            .stage, .logo-card, .ring, .progress::after, .dots i { animation: none !important; }
        }
    </style>
</head>
<body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="glow glow-c"></div>

    <main class="stage">
