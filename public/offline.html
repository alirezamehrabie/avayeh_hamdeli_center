        /* صفحه‌ی آفلاین — هم‌زبان با صفحه‌ی بارگذاری و ورود (برند روشن + هاله‌ها) */
        :root {
            --indigo: #5964AE;
            --indigo-deep: #4d56a3;
            --blue: #1572A1;
            --rose: #D4205F;
            --cyan: #36A9DF;
            --bg: #f8fbff;
            --ink: #1e293b;
            --muted: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'iransans', 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--ink);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
